[package]
name = "btor"
version = "0.2.2"
license = "MIT"
description = "Rust library for parsing and deparsing BTOR files"
edition = "2024"
repository = "https://github.com/gipsyh/rIC3"
authors = ["Yuheng Su <gipsyh.icu@gmail.com>"]
keywords = ["formal_method", "model_checking"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
giputils.workspace = true
logicrs.workspace = true
num-bigint = "0.4.5"
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strum = { version = "0.28", features = ["derive"] }
