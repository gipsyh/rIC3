[package]
name = "logicrs"
version = "0.6.1"
license = "MIT"
description = "Rust library for logic expression"
edition = "2024"
repository = "https://github.com/gipsyh/rIC3"
authors = ["Yuheng Su <gipsyh.icu@gmail.com>"]
keywords = ["logic"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
giputils.workspace = true
ahash = "0.8.11"
rand = "0.10"
log = "0.4.27"
lazy_static = "1.5.0"
inventory = "0.3.20"
enum-as-inner = "0.6.1"
serde = { version = "1.0.228", features = ["derive"] }
enumflags2 = "0.7"
libc = "0.2"
